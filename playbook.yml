---
- name: Deploy final project Compose stack
  hosts: localhost
  connection: local
  become: true

  vars:
    app_dir: /opt/final_project

  tasks:
    - name: Install Docker and Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy project files
      ansible.builtin.copy:
        src: project_files/
        dest: "{{ app_dir }}/"
        mode: preserve

    - name: Build and start Compose stack
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ app_dir }}/compose.yaml"
          - up
          - -d
          - --build
      register: up
      changed_when: >-
        'Started' in up.stderr or
        'Created' in up.stderr or
        'Creating' in up.stderr or
        'Recreate' in up.stderr or
        'Recreating' in up.stderr or
        'Building' in up.stderr